<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Verlof">
<title>Verlof-Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script>
(function(){var p=localStorage.getItem('verlof-theme')||'system';var d=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'})();
</script>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#18212B; --head:#18212B; --muted:#5E6975; --line:#D9DEE3; --soft:#E9EDF1;
  --navy:#18212B; --orange:#1F9D55; --green:#1F9D55;
  --primary:#18212B; --on-primary:#FFFFFF; --sel:#4A8FD6;
  --verlof:#1F9D55; --adv:#8DC63F; --tvt:#4A8FD6; --holiday:#F0A868; --on-holiday:#2A1A0A; --weekend:#E4E8EC;
  --danger:#C23B3B; --ok:#1F9D55;
  --shadow:0 1px 2px rgba(24,33,43,.06),0 4px 14px rgba(24,33,43,.06); --shadow-s:0 1px 3px rgba(24,33,43,.08);
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --r:8px; --ease:cubic-bezier(.4,0,.2,1);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#141B23; --surface:#1D2630; --ink:#E7ECF0; --head:#F4F7F9; --muted:#9AA6B2; --line:#2F3B47; --soft:#26313C;
  --primary:#E7ECF0; --on-primary:#141B23; --sel:#5A9FE6;
  --holiday:#C9834A; --on-holiday:#1E1206; --weekend:#232D37;
  --danger:#F07070; --ok:#5CC98A;
  --shadow:none; --shadow-s:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);transition:background-color .2s var(--ease),color .2s var(--ease)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}a:hover{color:var(--head)}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.num,.balance .big,.tile .val,.fcrow .end,.calhead h2,.day .d,.ystats .val,.wrow .wn,.month .wn,.spend h2,.trip .tt,.tripsum .num,.hm,.wk,.tripbars .v,.tripbars .y{font-family:var(--num);font-variant-numeric:tabular-nums}
.balance .big{font-weight:700;font-size:56px;letter-spacing:0}.calhead h2{font-size:28px;letter-spacing:0}.day .d{font-size:18px}

header.top{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px 8px 18px;max-width:600px;margin:0 auto}
header.top h1{font-weight:800;font-size:21px;margin:0;color:var(--head);letter-spacing:-.2px;flex:1;line-height:1.1}
header.top h1 span{color:var(--muted)}
.wk{font-weight:600;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;font-variant-numeric:tabular-nums}
.hbtn{width:44px;height:44px;border:0;background:none;border-radius:var(--r);display:grid;place-items:center;color:var(--head)}
.hbtn:active{background:var(--soft)}
.hbtn svg{width:22px;height:22px}
.hbtn[aria-pressed="true"]{background:var(--soft)}
main{padding:4px 14px calc(110px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto}
section.view{display:none}
section.view.on{display:block}
h2.ttl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;max-width:600px;margin:0 auto;align-items:end}
nav.tabs button.tb{background:none;border:0;padding:9px 0 10px;min-height:60px;font-size:12px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav.tabs button.tb[aria-current="page"]{color:var(--head);font-weight:700}
nav.tabs button.tb[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--orange);border-radius:0 0 3px 3px}
nav.tabs svg{width:23px;height:23px}
.fab{justify-self:center;width:58px;height:58px;margin:-22px 0 10px;border-radius:var(--r);border:0;background:var(--verlof);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(31,157,85,.35);transition:background-color .15s var(--ease)}
.fab:active{background:#17834A}
.fab svg{width:28px;height:28px}

/* balance */
.balance{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
[data-theme="light"] .balance{border-color:transparent}
.balance .row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.balance h3{margin:0;font-size:16px;font-weight:700;color:var(--head);display:flex;align-items:center;gap:9px}
.balance h3 i,.sw{width:12px;height:12px;border-radius:3px;background:var(--c);display:inline-block;flex:none}
.balance .days{color:var(--muted);font-size:14px;font-weight:500}
.balance .big{font-weight:800;font-size:50px;line-height:1;margin:8px 0 12px;font-variant-numeric:tabular-nums;color:var(--head);letter-spacing:-1px}
.balance .big.neg{color:var(--danger)}
.balance .big small{font-size:17px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.bar{display:flex;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%}
.bar .t{background:var(--c)}
.bar .p{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px)}
.legend3{display:flex;gap:16px;margin-top:9px;font-size:13px;color:var(--muted)}
.legend3 b{color:var(--ink);font-weight:700}
.balance.empty .big{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0;line-height:1.4;margin-bottom:2px}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .lab{font-size:13px;color:var(--muted)}
.tile .val{font-size:22px;font-weight:700;color:var(--head);font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0}
.check-line{font-size:13px;color:var(--muted);margin:4px 2px 14px}

/* forecast */
.fc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fcrow{padding:14px 16px;border-bottom:1px solid var(--line)}
.fcrow:last-child{border-bottom:0}
.fcrow .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fcrow .nm{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--head)}
.fcrow .end{font-weight:800;font-size:22px;color:var(--head);font-variant-numeric:tabular-nums}
.fcrow .end.neg{color:var(--danger)}
.fcsplit{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--soft);margin:10px 0 8px}
.fcsplit .k{background:var(--c)}
.fcsplit .l{background:var(--danger)}
.fcmeta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.fcmeta b{color:var(--ink);font-weight:700}
.fcmeta b.lose{color:var(--danger)}
.fchint{font-size:13px;margin-top:6px;color:var(--ink)}
.fchint.warn{color:var(--danger);font-weight:600}
.fcfoot{font-size:12.5px;color:var(--muted);padding:10px 16px;background:var(--soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:12px 14px;min-height:46px;font-weight:600;color:var(--head);transition:background-color .15s var(--ease)}
.btn:active{background:var(--soft)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}
.note{font-size:14px;color:var(--muted);margin:6px 2px 14px}

/* month */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.calhead h2{margin:0;font-size:24px;font-weight:800;color:var(--head);letter-spacing:-.3px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:44px;height:44px;display:grid;place-items:center;color:var(--head)}
.iconbtn svg{width:18px;height:18px}
.swipe{touch-action:pan-y}
.month{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr));gap:4px}
.month .h{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px;font-weight:600}
.month .wn{font-size:12px;color:var(--muted);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.day{aspect-ratio:1/1.12;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);position:relative;padding:5px 5px 4px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:var(--ink)}
.day .d{font-size:16px;font-weight:700;line-height:1;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.day .t{font-size:10px;font-weight:700;line-height:1.1;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.out{visibility:hidden}
.day.we{background:var(--weekend);border-color:transparent;color:var(--muted)}
.day.hol{background:var(--holiday);border-color:transparent;color:var(--on-holiday)}
.day.pre{opacity:.35}
.day.today{box-shadow:inset 0 0 0 2px var(--head)}
.day.today .d::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--orange);margin-top:3px}
.day .fill{position:absolute;left:0;right:0;bottom:0;z-index:0}
.day.has{color:#fff;border-color:transparent}
.day.has.adv{color:#1B2A0B}
.day.sel{outline:3px solid var(--sel);outline-offset:1px}
.day.intrip::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--head);z-index:2}
.modebar{display:flex;gap:8px;margin:14px 0 8px}
.modebar .btn{flex:1;font-size:15px}
.modebar .btn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:10px 2px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:6px 0 0}

/* year */
.ystats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.ystats > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.ystats .lab{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.ystats .val{font-size:24px;font-weight:800;color:var(--head);font-variant-numeric:tabular-nums}
.weeks{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px}
.wrow{display:grid;grid-template-columns:30px repeat(7,1fr) 40px;gap:3px;align-items:center;padding:2px 0;border:0;background:none;width:100%}
.wrow.hdr{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.wrow .wn{font-size:13px;color:var(--muted);text-align:left;padding-left:2px;font-variant-numeric:tabular-nums}
.wrow .c{height:16px;border-radius:3px;background:var(--soft)}
.wrow .c.we{background:var(--weekend)}
.wrow .c.hol{background:var(--holiday)}
.wrow .c.pre,.wrow .c.out{background:transparent}
.wrow .mo{font-size:11px;color:var(--muted);text-align:right}
.wrow.cur .wn{color:var(--head);font-weight:800}
.wrow.cur{box-shadow:inset 0 0 0 2px var(--orange);border-radius:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(1,12,26,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:12px 12px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:11;
  transform:translateY(105%);visibility:hidden;transition:transform .24s var(--ease),visibility 0s .24s;max-width:600px;margin:0 auto;max-height:90vh;overflow:auto}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet.on{transform:none;visibility:visible;transition:transform .24s var(--ease)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sheet h3{margin:0 0 2px;font-size:22px;font-weight:800;color:var(--head)}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 7px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 14px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.chip i{width:11px;height:11px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.existing{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.existing .n{display:flex;align-items:center;gap:9px;font-weight:600}
.existing .n i{width:11px;height:11px;border-radius:3px;background:var(--c)}
.existing button{background:none;border:0;color:var(--danger);font-weight:600;padding:10px 6px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.hm{width:96px;min-height:44px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);font-size:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.bcsrow{display:grid;grid-template-columns:1fr 104px 80px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.bcsrow .app{font-size:16px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bcsrow .app.bad{color:var(--danger);font-weight:700}
.bcsrow .app.good{color:var(--ok);font-weight:700}
.dates2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates2 label{font-size:13px;font-weight:600;color:var(--muted)}
.dates2 input{display:block;width:100%;margin-top:5px;min-height:46px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);font-size:16px}
.count{font-size:14px;color:var(--muted);margin-top:10px}
.count b{color:var(--head)}

/* trips */
.spend{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 2px 10px}
.spend h2{margin:0;font-size:32px;font-weight:800;color:var(--head);font-variant-numeric:tabular-nums}
.spend .lab{color:var(--muted);font-size:14px}
.tripbars{display:flex;align-items:flex-end;gap:8px;height:150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 8px;margin-bottom:12px}
.tripbars button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;background:none;border:0;gap:4px;padding:0}
.tripbars .b{width:100%;max-width:46px;border-radius:3px 3px 0 0;background:var(--line);min-height:2px}
.tripbars button[aria-pressed="true"] .b{background:var(--orange)}
.tripbars .v{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tripbars button[aria-pressed="true"] .v{color:var(--head);font-weight:700}
.tripbars .y{font-size:14px;font-weight:600;color:var(--head)}
.trip{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;color:var(--ink)}
.trip .nm{font-weight:700;font-size:16px;color:var(--head)}
.trip .tt{font-size:18px;font-weight:800;text-align:right;color:var(--head);font-variant-numeric:tabular-nums}
.trip .meta{font-size:13px;color:var(--muted)}
.trip .flag{grid-column:1/-1;font-size:13px;color:var(--danger)}
.tf label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 0}
.tf input{display:block;width:100%;margin-top:5px;min-height:46px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);font-size:16px}
.tf .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow input,.crow input{min-height:44px;padding:8px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);font-size:15px;width:100%;min-width:0}
.frow .x{grid-row:1/3;grid-column:3;background:none;border:0;color:var(--danger);font-size:22px}
.crow{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.crow .x{background:none;border:0;color:var(--danger);font-size:22px}
.addrow{margin-top:8px;font-size:15px}
.tripsum{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-weight:700;color:var(--head)}
.tripsum .num{font-size:24px;font-weight:800}

/* settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px;font-weight:700;color:var(--head)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:11px 6px;min-height:44px;font-weight:600;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.field{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:12px}
.field:last-child{border-bottom:0}
.field .fl{font-weight:600}
.field .fi{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.field label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.field input[type=number]{width:84px;min-height:42px;padding:7px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
.hist{font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.hist div:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--bg);padding:11px 18px;border-radius:var(--r);font-weight:600;font-size:14px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:20}
.toast.on{opacity:1}
.welcome{padding:24px 4px}
.welcome h2{font-size:28px;font-weight:800;color:var(--head);margin:0 0 8px;line-height:1.15}
.welcome p{color:var(--muted);margin:0 0 20px}
.welcome .btn{margin-bottom:10px}
.demo{background:var(--tvt);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:4px}
</style>
</head>
<body>
<div class="demo" id="demo" hidden>Preview data, not saved</div>
<header class="top">
  <h1 id="htitle">Verlof<span>-</span>Tracker</h1>
  <span class="wk" id="wk"></span>
  <button class="hbtn" data-act="theme" id="themeBtn" aria-label="Dark mode"></button>

const dow=d=>(d.getDay()+6)%7;

function isoWeeksInYear(y){return isoWeek(new Date(y,11,28))}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
const holCache={};
function holidays(y){
  if(holCache[y])return holCache[y];
  const e=easter(y);let kd=new Date(y,3,27);if(kd.getDay()===0)kd=new Date(y,3,26);
  const h={};
  h[`${y}-01-01`]='ny';h[ymd(addDays(e,1))]='em';h[ymd(kd)]='kd';h[ymd(addDays(e,39))]='asc';h[ymd(addDays(e,50))]='wm';h[`${y}-12-25`]='xm';h[`${y}-12-26`]='bd';
  return holCache[y]=h;
}
const holidayName=s=>{const k=holidays(+s.slice(0,4))[s];return k?t('hol')[k]:null};
const isWeekend=s=>dow(parse(s))>=5;
const isWorkday=s=>!isWeekend(s)&&!holidays(+s.slice(0,4))[s];
function fmtDate(s){const d=parse(s);const ds=t('dshort')[dow(d)],ms=t('mshort')[d.getMonth()];const yr=d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'';
  return lang==='nl'?`${ds} ${d.getDate()} ${ms}${yr}`:`${ds} ${d.getDate()} ${ms}${yr}`}

/* ---------- time format ---------- */
const hm=m=>{const neg=m<0;m=Math.abs(Math.round(m));return (neg?'−':'')+Math.floor(m/60)+':'+pad(m%60)};
const dnum=m=>Math.round(m/MDAY*100)/100;
const days=m=>t('days',dnum(m)).replace('-','−');
const dshort=m=>String(dnum(m)).replace('.',lang==='nl'?',':'.')+(lang==='nl'?'d':'d');
function parseHM(s){s=String(s).trim().replace(',','.');if(!s)return null;
  if(s.includes(':')){const[h,mm]=s.split(':');if(!/^\d+$/.test(h)||!/^\d{1,2}$/.test(mm||'0'))return null;return(+h)*60+(+mm||0)}
  const n=Number(s);return isNaN(n)?null:Math.round(n*60)}

/* ---------- state ---------- */
let DEMO=false;
let S=load();
function blank(){return{schemaVersion:2,trips:[],settings:{minutesPerDay:MDAY,employmentStart:'2023-02-01',defaultAllowanceMinutes:{verlof:216*60,adv:104*60},carryLimitMinutes:{verlof:null,adv:null}},years:{},bcsChecks:[],entries:[]}}
function load(){try{const r=localStorage.getItem(KEY);return r?normalize(JSON.parse(r)):null}catch(e){return null}}
function save(){if(DEMO)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast(t('couldNotSave'))}}
function uid(){return Math.random().toString(36).slice(2,10)}
function totals(entries){const r={verlof:0,adv:0,tvt:0};entries.forEach(e=>{if(r[e.type]!=null)r[e.type]+=e.minutes});return r}
function normalize(d){
  const b=blank();
  const out={...b,...d,settings:{...b.settings,...(d.settings||{})}};
  out.settings.defaultAllowanceMinutes={...b.settings.defaultAllowanceMinutes,...(d.settings&&d.settings.defaultAllowanceMinutes||{})};
  out.settings.carryLimitMinutes={...b.settings.carryLimitMinutes,...(d.settings&&d.settings.carryLimitMinutes||{})};
  out.entries=(d.entries||[]).filter(e=>TYPES[e.type]&&/^\d{4}-\d\d-\d\d$/.test(e.date)).map(e=>({id:e.id||uid(),date:e.date,type:e.type,minutes:+e.minutes||MDAY,label:e.label||'',createdAt:e.createdAt||null}));
  const tot=totals(out.entries);
  out.bcsChecks=(d.bcsChecks||[]).map(c=>({date:c.date,savedAt:c.savedAt||c.date+'T12:00:00',minutes:{verlof:0,adv:0,tvt:0,...c.minutes},bookedAtCheck:c.bookedAtCheck||{...tot},note:c.note||''}));
  out.years=d.years||{};
  const num=v=>v===''||v==null?null:(+String(v).replace(',','.')||0);
  out.trips=(d.trips||[]).map(x=>({id:x.id||uid(),name:x.name||'Trip',start:x.start,end:x.end||x.start,note:x.note||'',flag:x.flag||'',
    flights:(x.flights||[]).map(f=>({date:f.date||x.start,time:f.time||'',route:f.route||'',airline:f.airline||'',cost:num(f.cost)})),
    costs:(x.costs||[]).map(c=>({label:c.label||'',amount:num(c.amount)}))})).filter(x=>/^\d{4}-\d\d-\d\d$/.test(x.start||''));
  return out;
}
function allowance(y,k){const yr=S.years[y];if(yr&&yr.allowanceMinutes&&yr.allowanceMinutes[k]!=null)return yr.allowanceMinutes[k];return S.settings.defaultAllowanceMinutes[k]||0}
function anchor(){return S.bcsChecks.slice().sort((a,b)=>a.savedAt<b.savedAt?-1:1).pop()||null}
function balances(){
  const a=anchor();if(!a)return null;
  const tot=totals(S.entries);const ty=new Date().getFullYear();const ay=+a.date.slice(0,4);
  const r={};
  TKEYS.forEach(k=>{let add=0;for(let y=ay+1;y<=ty;y++){if(k!=='tvt')add+=allowance(y,k)}
    r[k]=a.minutes[k]+add-(tot[k]-(a.bookedAtCheck[k]||0))});
  return r;
}
function yearSplit(y){const today=todayStr();const r={};TKEYS.forEach(k=>r[k]={taken:0,planned:0});
  S.entries.forEach(e=>{if(+e.date.slice(0,4)!==y)return;r[e.type][e.date<=today?'taken':'planned']+=e.minutes});return r}
const entriesOn=s=>S.entries.filter(e=>e.date===s);
function freeWorkdaysLeft(){const y=new Date().getFullYear();const set=new Set(S.entries.map(e=>e.date));let n=0;
  for(let d=addDays(new Date(),1);d.getFullYear()===y;d=addDays(d,1)){const s=ymd(d);if(isWorkday(s)&&!set.has(s))n++}return n}

/* ---------- ui helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}
let tab='home',lastTab='home';

/* ---------- home ---------- */
function renderHome(){
  const b=balances();const y=new Date().getFullYear();const sp=yearSplit(y);

    const T=TYPES[k];const tk=sp[k].taken,pl=sp[k].planned;

    const free=b[k];const whole=Math.max(tk+pl+Math.max(free,0),1);
    return `<div class="balance" style="--c:${T.c}">
      <div class="row1"><h3><i></i>${T.name}</h3><span class="days">${t('free',days(free).replace(/^(.*)$/,'$1'))}</span></div>
      <div class="big ${free<0?'neg':''}">${hm(free)}<small>${t('hrs')}</small></div>
      <div class="bar" aria-hidden="true"><i class="t" style="width:${tk/whole*100}%"></i><i class="p" style="width:${pl/whole*100}%"></i></div>
      <div class="legend3"><span>${t('taken')} <b>${dshort(tk)}</b></span><span>${t('planned')} <b>${dshort(pl)}</b></span><span>${t('inYear',y)}</span></div>
    </div>`}).join('');
  const a=anchor();
  $('#checkline').textContent=a?t('lastCheck',fmtDate(a.date)):t('noCheck');
  const today=todayStr();const fut=[...new Set(S.entries.filter(e=>e.date>today).map(e=>e.date))].sort();
  if(fut.length){const first=fut[0];let n=0,d=parse(first);const set=new Set(S.entries.map(e=>e.date));
    while(true){const s=ymd(d);if(set.has(s)){n+=entriesOn(s).reduce((x,e)=>x+e.minutes,0)/MDAY}else if(isWorkday(s))break;d=addDays(d,1);if(n>60)break}
    const inD=Math.round((parse(first)-parse(today))/864e5);
    $('#nextleave').textContent=inD===1?t('tomorrow'):t('inDays',inD);
    $('#nextleave2').textContent=`${fmtDate(first)}, ${days(n*MDAY)}`;
  }else{$('#nextleave').textContent=t('nonePlanned');$('#nextleave2').textContent=''}
  const fl=S.trips.flatMap(x=>x.flights.map(f=>({...f,trip:x.name}))).filter(f=>f.date>=today).sort((p,q)=>(p.date+p.time)<(q.date+q.time)?-1:1);
  $('#flightstrip').hidden=!fl.length;
  if(fl.length){const f=fl[0];const n=Math.round((parse(f.date)-parse(today))/864e5);
    $('#nextflight').textContent=n===0?t('todayW'):n===1?t('tomorrow'):t('inDays',n);
    $('#nextflight2').textContent=[fmtDate(f.date),f.time,f.route,f.trip].filter(Boolean).join(', ')}
  $('#weeksleftlab').textContent=t('weeksLeft',y);$('#weeksleft').textContent=Math.max(isoWeeksInYear(y)-isoWeek(new Date()),0);
  const wl=freeWorkdaysLeft();$('#workleft').textContent=t('workLeft',wl);
  renderForecast(b,y,wl);
}
function renderForecast(b,y,wl){
  $('#fctitle').textContent=t('fcTitle',y);
  if(!b){$('#forecast').innerHTML=`<div class="fcrow"><div class="fchint">${t('noCheck')}</div></div>`;return}
  const after={verlof:0,adv:0,tvt:0};S.entries.forEach(e=>{if(+e.date.slice(0,4)>y)after[e.type]+=e.minutes});
  const lim=S.settings.carryLimitMinutes||{};
  let anyNoLimit=false;
  const rows=['verlof','adv'].map(k=>{
    const end=b[k]+after[k];const L=lim[k];
    const carry=L==null?end:Math.min(end,L);const lose=Math.max(end-carry,0);
    if(L==null)anyNoLimit=true;
    const next=Math.max(carry,0)+allowance(y+1,k)+(end<0?end:0);
    const tot=Math.max(end,1);
    let hint;
    if(L==null)hint=`<div class="fchint" style="color:var(--muted)">${t('fcNoLimit')}</div>`;
    else if(lose>0)hint=`<div class="fchint warn">${t('fcLoseHint',days(lose))}</div>`;
    else hint=`<div class="fchint">${t('fcOk')}</div>`;
    return `<div class="fcrow" style="--c:${TYPES[k].c}">
      <div class="hd"><span class="nm"><i class="sw"></i>${TYPES[k].name}</span><span class="end ${end<0?'neg':''}">${hm(end)}<span style="font-size:14px;font-weight:600;color:var(--muted);margin-left:4px">${t('hrs')}</span></span></div>
      ${end>0?`<div class="fcsplit" aria-hidden="true"><i class="k" style="width:${Math.max(carry,0)/tot*100}%"></i><i class="l" style="width:${lose/tot*100}%"></i></div>`:'<div style="height:8px"></div>'}
      <div class="fcmeta"><span>${t('fcCarry')} <b>${hm(Math.max(carry,0))}</b></span><span>${t('fcLose')} <b class="${lose>0?'lose':''}">${hm(lose)}</b></span><span>${t('fcNext',y+1)} <b>${hm(next)}</b></span></div>
      ${hint}
    </div>`}).join('');
  $('#forecast').innerHTML=rows+`<div class="fcfoot">${t('fcFoot')}${anyNoLimit?` <button class="linkbtn" data-act="settings">${t('fcSet')}</button>`:''}</div>`;
}

/* ---------- month ---------- */
let mCur=new Date();mCur=new Date(mCur.getFullYear(),mCur.getMonth(),1);
let rangeMode=false,rangeStart=null;
function dayClass(s,inMonth){
  const c=['day'];if(!inMonth)c.push('out');
  if(s<S.settings.employmentStart)c.push('pre');
  if(isWeekend(s))c.push('we');else if(holidayName(s))c.push('hol');
  if(s===todayStr())c.push('today');
  return c;
}
function renderMonth(){
  $('#mtitle').textContent=`${cap(t('months')[mCur.getMonth()])} ${mCur.getFullYear()}`;
  let h='<div class="h"></div>'+t('dshort').map(d=>`<div class="h">${d}</div>`).join('');
  let d=addDays(mCur,-dow(mCur));const last=new Date(mCur.getFullYear(),mCur.getMonth()+1,0);
  while(true){
    if(dow(d)===0)h+=`<div class="wn">${isoWeek(d)}</div>`;
    const s=ymd(d);const inM=d.getMonth()===mCur.getMonth();const cls=dayClass(s,inM);
    const es=entriesOn(s);let fill='',lab='';
    if(es.length&&!isWeekend(s)){cls.push('has');
      if(es.length===1&&es[0].minutes>=MDAY){cls.push(es[0].type);fill=`<span class="fill" style="top:0;background:${TYPES[es[0].type].c}"></span>`}
      else{let top=0;const sum=es.reduce((x,e)=>x+e.minutes,0);
        fill=es.map(e=>{const hg=e.minutes/Math.max(MDAY,sum)*100;const f=`<span class="fill" style="top:${100-top-hg}%;bottom:${top}%;background:${TYPES[e.type].c}"></span>`;top+=hg;return f}).join('');
        if(sum<MDAY)cls.splice(cls.indexOf('has'),1);
        lab=es.map(e=>TYPES[e.type].name[0]+hm(e.minutes).replace(':00','')).join(' ')}
    }
    if(rangeStart===s)cls.push('sel');
    if(tripOn(s))cls.push('intrip');
    h+=`<button class="${cls.join(' ')}" data-day="${s}" ${inM?'':'tabindex="-1" aria-hidden="true"'} aria-label="${fmtDate(s)}${es.length?', '+es.map(e=>TYPES[e.type].name+' '+hm(e.minutes)).join(', '):''}${holidayName(s)?', '+holidayName(s):''}">${fill}<span class="d">${d.getDate()}</span><span class="t">${esc(lab)}</span></button>`;
    d=addDays(d,1);
    if(d>last&&dow(d)===0)break;
  }
  $('#month').innerHTML=h;
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function stepMonth(n){slide($('#month'),n,()=>{mCur=new Date(mCur.getFullYear(),mCur.getMonth()+n,1);renderMonth()})}
function stepYear(n){slide($('#yanim'),n,()=>{yCur+=n;renderYear()})}
function onDay(s){
  if(s<S.settings.employmentStart){toast(t('beforeStart'));return}
  if(rangeMode){
    if(!rangeStart){rangeStart=s;renderMonth();return}
    let a=rangeStart,b=s;if(b<a)[a,b]=[b,a];rangeStart=null;setRange(false);openRange(a,b);return}
  if(isWeekend(s)){toast(t('weekendsNever'));return}
  openDay(s);
}
function setRange(on){rangeMode=on;rangeStart=null;$('#rangeBtn').setAttribute('aria-pressed',on);$('#rangehint').hidden=!on;renderMonth()}

/* swipe */
(function(){let sx=0,sy=0,st=0;
  document.querySelectorAll('.swipe').forEach(el=>{
    el.addEventListener('touchstart',e=>{const p=e.touches[0];sx=p.clientX;sy=p.clientY;st=Date.now()},{passive:true});
    el.addEventListener('touchend',e=>{const p=e.changedTouches[0];const dx=p.clientX-sx,dy=p.clientY-sy;
      if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-st>700)return;
      const n=dx<0?1:-1;if(el.id==='v-month')stepMonth(n);else stepYear(n)},{passive:true});
  });
})();

/* ---------- year ---------- */
let yCur=new Date().getFullYear();
function renderYear(){
  $('#ytitle').textContent=yCur;
  const sp=yearSplit(yCur);
  $('#ystats').innerHTML=TKEYS.map(k=>`<div style="--c:${TYPES[k].c}"><div class="lab"><i class="sw"></i>${TYPES[k].name}</div><div class="val">${String(dnum(sp[k].taken+sp[k].planned)).replace('.',lang==='nl'?',':'.')}</div><div class="lab">${t('daysW')}</div></div>`).join('');
  const n=isoWeeksInYear(yCur);let d=new Date(yCur,0,4);d=addDays(d,-dow(d));
  const curW=yCur===new Date().getFullYear()?isoWeek(new Date()):-1;
  let h=`<div class="wrow hdr"><span>${lang==='nl'?'Wk':'W'}</span>${t('dshort').map(x=>`<span>${x[0].toUpperCase()}</span>`).join('')}<span></span></div>`;
  for(let w=1;w<=n;w++){
    let cells='';
    for(let i=0;i<7;i++){const s=ymd(addDays(d,i));const es=entriesOn(s);let cls='c';let st='';
      if(s<S.settings.employmentStart)cls+=' pre';else if(isWeekend(s))cls+=' we';else if(holidayName(s))cls+=' hol';
      if(es.length&&!isWeekend(s)){const sum=es.reduce((x,e)=>x+e.minutes,0);
        if(es.length===1)st=`background:${sum>=MDAY?TYPES[es[0].type].c:`linear-gradient(to top,${TYPES[es[0].type].c} 50%,var(--soft) 50%)`}`;
        else st=`background:linear-gradient(to top,${TYPES[es[0].type].c} 50%,${TYPES[es[1].type].c} 50%)`}
      cells+=`<span class="${cls}" style="${st}"></span>`}
    const mlab=(w===1||d.getDate()<=7)?cap(t('mshort')[d.getMonth()]):'';
    h+=`<button class="wrow${w===curW?' cur':''}" data-week="${ymd(d)}" aria-label="${t('week',w)}"><span class="wn">${w}</span>${cells}<span class="mo">${mlab}</span></button>`;
    d=addDays(d,7);

/* ---------- sheets ---------- */
function openSheet(html,keep){const sh=$('#sheet');const st=sh.scrollTop;sh.innerHTML=html;sh.classList.add('on');$('#scrim').classList.add('on');if(keep){sh.scrollTop=st;return}sh.scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');td=null;draft={}}
let draft={};
function typeChips(sel){return TKEYS.map(k=>`<button class="chip" style="--c:${TYPES[k].c}" data-type="${k}" aria-pressed="${sel===k}"><i></i>${TYPES[k].name}</button>`).join('')}
function amountChips(sel){return [[MDAY,t('fullDay')],[MDAY/2,t('halfDay')]].map(([m,l])=>`<button class="chip" data-amt="${m}" aria-pressed="${sel===m}">${l}</button>`).join('')+`<input class="hm" id="amtCustom" inputmode="decimal" placeholder="h:mm" aria-label="${t('otherAmt')}" value="${sel!==MDAY&&sel!==MDAY/2&&sel?hm(sel):''}">`}
function openDay(s){
  const es=entriesOn(s);const used=es.reduce((x,e)=>x+e.minutes,0);
  draft={mode:'day',date:s,type:es.length?null:'verlof',amt:Math.min(MDAY-used,MDAY)||MDAY/2};
  if(es.length&&used<MDAY)draft.type=TKEYS.find(k=>!es.some(e=>e.type===k));
  openSheet(`<h3>${fmtDate(s)}</h3><div class="sub">${t('week',isoWeek(parse(s)))}${holidayName(s)?', '+holidayName(s):''}${tripOn(s)?', '+t('tripC',esc(tripOn(s).name)):''}</div>
    ${es.map(e=>`<div class="existing"><span class="n" style="--c:${TYPES[e.type].c}"><i></i>${TYPES[e.type].name} ${hm(e.minutes)}</span><button data-del="${e.id}">${t('remove')}</button></div>`).join('')}
    ${used<MDAY?`<div class="lbl">${es.length?t('addRest'):t('markAs')}</div><div class="chips" id="tchips">${typeChips(draft.type)}</div>
    <div class="lbl">${t('hours')}</div><div class="chips" id="achips">${amountChips(draft.amt)}</div>
    <div class="actions"><button class="btn" data-act="close">${t('cancel')}</button><button class="btn primary" data-act="saveday">${t('save')}</button></div>`
    :`<div class="actions"><button class="btn primary" data-act="close">${t('done')}</button></div>`}`);
}
function workdaysIn(a,b){const ds=[];if(!a||!b)return ds;if(b<a)[a,b]=[b,a];for(let d=parse(a);ymd(d)<=b;d=addDays(d,1)){const s=ymd(d);if(isWorkday(s)&&s>=S.settings.employmentStart)ds.push(s)}return ds}
function openRange(a,b){
  const ds=workdaysIn(a,b);
  draft={mode:'range',dates:ds,type:'verlof',amt:MDAY};
  const over=ds.filter(s=>entriesOn(s).length).length;
  openSheet(`<h3>${fmtDate(a)} – ${fmtDate(b)}</h3><div class="sub">${t('workingDays',ds.length)}. ${t('skipped')}${over?' '+t('replaced',over):''}</div>
    ${ds.length?`<div class="lbl">${t('markRange')}</div><div class="chips" id="tchips">${typeChips('verlof')}</div>
    <div class="actions"><button class="btn" data-act="clearrange">${t('clearDays')}</button><button class="btn primary" data-act="saverange">${t('save')}</button></div>`
    :`<div class="actions"><button class="btn primary" data-act="close">${t('close')}</button></div>`}`);
}
function openAdd(){
  let s=todayStr();
  if(tab==='month'){const n=new Date();if(mCur.getMonth()!==n.getMonth()||mCur.getFullYear()!==n.getFullYear())s=ymd(mCur)}
  let d=parse(s);while(!isWorkday(ymd(d)))d=addDays(d,1);s=ymd(d);
  draft={mode:'add',from:s,to:s,type:'verlof',amt:MDAY};
  openSheet(`<h3>${t('addLeave')}</h3>
    <div class="dates2" style="margin-top:10px"><label>${t('from')}<input type="date" data-ad="from" value="${s}"></label><label>${t('to')}<input type="date" data-ad="to" value="${s}"></label></div>
    <div class="count" id="adcount"></div>
    <div class="lbl">${t('markRange')}</div><div class="chips" id="tchips">${typeChips('verlof')}</div>
    <div class="lbl">${t('perDay')}</div><div class="chips" id="achips">${amountChips(MDAY)}</div>
    <div class="actions"><button class="btn" data-act="close">${t('cancel')}</button><button class="btn primary" data-act="saveadd">${t('save')}</button></div>`);
  updAddCount();
}
function updAddCount(){const ds=workdaysIn(draft.from,draft.to);const el=$('#adcount');if(!el)return;
  el.innerHTML=ds.length?`<b>${t('workingDays',ds.length)}</b>. ${t('skipped')}`:t('noWorkdays')}
function openBCS(){
  const b=balances();
  openSheet(`<h3>${t('bcsTitle')}</h3><div class="sub">${t('bcsSub')}</div>
    <div class="bcsrow" style="font-size:13px;color:var(--muted);font-weight:600"><span></span><span>BCS</span><span style="text-align:right">${t('app')}</span></div>
    ${TKEYS.map(k=>`<div class="bcsrow"><span style="display:flex;align-items:center;gap:9px;font-weight:600;--c:${TYPES[k].c}"><i class="sw"></i>${TYPES[k].name}</span><input class="hm" id="bcs-${k}" inputmode="decimal" placeholder="0:00" value="${b?hm(Math.max(b[k],0)):''}"><span class="app" id="cmp-${k}">${b?hm(b[k]):'–'}</span></div>`).join('')}
    <div class="note" id="bcsmsg"></div>
    <div class="actions"><button class="btn" data-act="close">${t('cancel')}</button><button class="btn primary" data-act="savebcs">${t('saveCheck')}</button></div>`);
  const upd=()=>{let diffs=0;TKEYS.forEach(k=>{const v=parseHM($('#bcs-'+k).value);const el=$('#cmp-'+k);if(!b||v==null){el.className='app';return}
      const ok=v===b[k];el.className='app '+(ok?'good':'bad');if(!ok)diffs++});
    $('#bcsmsg').textContent=!b?'':diffs?t('mismatch'):t('matches')};
  TKEYS.forEach(k=>$('#bcs-'+k).addEventListener('input',upd));upd();
}

/* ---------- trips ---------- */
const eur=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n||0);
const money=v=>{if(v==null||String(v).trim()==='')return null;const n=Number(String(v).replace(/[€\s]/g,'').replace(',','.'));return isNaN(n)?NaN:n};
const tripTotal=x=>x.flights.reduce((s,f)=>s+(+f.cost||0),0)+x.costs.reduce((s,c)=>s+(+c.amount||0),0);
const tripOn=s=>S.trips.find(x=>s>=x.start&&s<=x.end);
const leaveIn=x=>S.entries.filter(e=>e.date>=x.start&&e.date<=x.end).reduce((s,e)=>s+e.minutes,0);
let tYear=new Date().getFullYear();
function renderTrips(){
  const cy=new Date().getFullYear();
  const ys=S.trips.map(x=>+x.start.slice(0,4));const y0=Math.min(2023,...ys),y1=Math.max(cy,...ys);
  const tot={};for(let y=y0;y<=y1;y++)tot[y]=0;S.trips.forEach(x=>tot[+x.start.slice(0,4)]+=tripTotal(x));
  const max=Math.max(1,...Object.values(tot));
  $('#tripbars').innerHTML=Object.keys(tot).map(y=>`<button data-tyear="${y}" aria-pressed="${+y===tYear}" aria-label="${y}: ${eur(tot[y])}"><span class="v">${Math.round(tot[y])}</span><span class="b" style="height:${tot[y]/max*100}%"></span><span class="y">${y}</span></button>`).join('');
  $('#spendlab').textContent=t('spend',tYear);$('#spendval').textContent=eur(tot[tYear]||0);
  $('#spendall').textContent=t('allYears',eur(Object.values(tot).reduce((a,b)=>a+b,0)));
  const list=S.trips.filter(x=>+x.start.slice(0,4)===tYear).sort((a,b)=>a.start<b.start?-1:1);
  $('#triplist').innerHTML=list.length?list.map(x=>{const lv=leaveIn(x);const nd=Math.round((parse(x.end)-parse(x.start))/864e5);
    return `<button class="trip" data-trip="${x.id}"><span class="nm">${esc(x.name)}</span><span class="tt">${eur(tripTotal(x))}</span>
      <span class="meta">${fmtDate(x.start)} – ${fmtDate(x.end)}, ${t('nights',nd)}${lv?', '+days(lv)+' '+t('leave'):''}</span><span class="meta" style="text-align:right">${t('flights',x.flights.length)}</span>
      ${x.flag?`<span class="flag">${esc(x.flag)}</span>`:''}</button>`}).join(''):`<div class="note">${t('noTrips',tYear)}</div>`;
}
let td=null;
function openTrip(id){
  const x=id?S.trips.find(q=>q.id===id):null;
  td=x?JSON.parse(JSON.stringify(x)):{id:uid(),name:'',start:todayStr(),end:todayStr(),flights:[],costs:[],note:'',flag:'',isNew:true};
  drawTrip(true);
}
function drawTrip(first){
  const f=td;
  openSheet(`<h3>${f.isNew?t('newTrip'):esc(f.name||t('trip'))}</h3>
   ${f.flag?`<div class="sub" style="color:var(--danger)">${esc(f.flag)}</div>`:''}
   <div class="tf"><label>${t('name')}<input data-tf="name" value="${esc(f.name)}" placeholder="${t('phName')}"></label>
   <div class="two"><label>${t('from')}<input type="date" data-tf="start" value="${f.start}"></label><label>${t('to')}<input type="date" data-tf="end" value="${f.end}"></label></div></div>
   <div class="lbl">${t('flightsLbl')}</div>
   ${f.flights.map((x,i)=>`<div class="frow">
      <input type="date" data-ff="${i}:date" value="${x.date}" aria-label="Date"><input type="time" data-ff="${i}:time" value="${x.time}" aria-label="Time">
      <input data-ff="${i}:route" value="${esc(x.route)}" placeholder="AMS–TNG" aria-label="Route"><input data-ff="${i}:airline" value="${esc(x.airline)}" placeholder="${t('phAirline')}" aria-label="${t('phAirline')}">
      <input data-ff="${i}:cost" inputmode="decimal" value="${x.cost==null||isNaN(x.cost)?'':String(x.cost).replace('.',',')}" placeholder="€" aria-label="€" style="grid-column:1/3">
      <button class="x" data-delflight="${i}" aria-label="${t('remove')}">×</button></div>`).join('')}
   <button class="btn addrow" data-act="addflight">${t('addFlight')}</button>
   <div class="lbl">${t('otherCosts')}</div>
   ${f.costs.map((c,i)=>`<div class="crow"><input data-cf="${i}:label" value="${esc(c.label)}" placeholder="${t('phCost')}" aria-label="${t('otherCosts')}"><input data-cf="${i}:amount" inputmode="decimal" value="${c.amount==null||isNaN(c.amount)?'':String(c.amount).replace('.',',')}" placeholder="€" aria-label="€"><button class="x" data-delcost="${i}" aria-label="${t('remove')}">×</button></div>`).join('')}
   <button class="btn addrow" data-act="addcost">${t('addCost')}</button>
   <div class="tf"><label>${t('note')}<input data-tf="note" value="${esc(f.note)}"></label></div>
   <div class="tripsum"><span>${t('total')}</span><span class="num" id="tdtotal">${eur(tripTotal(f))}</span></div>
   <div class="actions">${f.isNew?'':`<button class="btn danger" data-act="deltrip">${t('del')}</button>`}<button class="btn" data-act="close">${t('cancel')}</button><button class="btn primary" data-act="savetrip">${t('saveTrip')}</button></div>`,!first);
}
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.dataset.ad&&draft.mode==='add'){draft[el.dataset.ad]=el.value;if(el.dataset.ad==='from'&&(!draft.to||draft.to<el.value)){draft.to=el.value;$('[data-ad="to"]').value=el.value}updAddCount();return}
  if(el.id==='amtCustom'&&el.value){document.querySelectorAll('#achips .chip').forEach(c=>c.setAttribute('aria-pressed','false'))}
  if(!td)return;
  if(el.dataset.tf){td[el.dataset.tf]=el.value}
  else if(el.dataset.ff){const[i,k]=el.dataset.ff.split(':');td.flights[+i][k]=k==='cost'?money(el.value):el.value}
  else if(el.dataset.cf){const[i,k]=el.dataset.cf.split(':');td.costs[+i][k]=k==='amount'?money(el.value):el.value}
  else return;
  const x=$('#tdtotal');if(x)x.textContent=eur(tripTotal({flights:td.flights.map(f=>({cost:isNaN(f.cost)?0:f.cost})),costs:td.costs.map(c=>({amount:isNaN(c.amount)?0:c.amount}))}));
});

/* ---------- settings ---------- */
function renderSettings(){
  applyTheme();applyI18n();
  const y=new Date().getFullYear();const ys=[y,y+1];
  $('#allowances').innerHTML=ys.map(yy=>`<div class="field"><span class="fl">${yy}</span><span class="fi">
     <label>Verlof <input type="number" min="0" step="1" data-allow="${yy}:verlof" value="${allowance(yy,'verlof')/60}"></label>
     <label>ADV <input type="number" min="0" step="1" data-allow="${yy}:adv" value="${allowance(yy,'adv')/60}"></label></span></div>`).join('');
  const L=S.settings.carryLimitMinutes||{};
  $('#carry').innerHTML=['verlof','adv'].map(k=>`<div class="field"><span class="fl" style="display:flex;align-items:center;gap:9px;--c:${TYPES[k].c}"><i class="sw"></i>${TYPES[k].name}</span><span class="fi"><label><input type="number" min="0" step="1" data-carry="${k}" placeholder="–" value="${L[k]==null?'':L[k]/60}"> ${t('hrs')}</label></span></div>`).join('');
  const cs=S.bcsChecks.slice().sort((a,b)=>a.savedAt<b.savedAt?1:-1);
  $('#bcshist').innerHTML=cs.length?cs.map(c=>`<div><span>${fmtDate(c.date)}</span><span class="num" style="color:var(--muted)">V ${hm(c.minutes.verlof)} · ADV ${hm(c.minutes.adv)} · TVT ${hm(c.minutes.tvt)}</span></div>`).join(''):`<div><span>${t('noChecks')}</span></div>`;
}

/* ---------- actions ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify({...S,app:'Verlof-Tracker',exportedAt:new Date().toISOString()},null,1)],{type:'application/json'});
  const name=`verlof-backup-${todayStr()}.json`;
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
$('#file').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.entries))throw 0;
    if(S&&S.entries.length&&!confirm(t('confirmReplace',f.name)))return;
    DEMO=false;$('#demo').hidden=true;
    S=normalize(d);save();toast(t('imported',S.entries.length));show('home')}
  catch(e){toast(t('notBackup'))}
});
function saveEntries(dates,type,m){
  let n=0,skip=0;const now=new Date().toISOString();
  if(m>=MDAY){const set=new Set(dates);S.entries=S.entries.filter(e=>!set.has(e.date));dates.forEach(s=>S.entries.push({id:uid(),date:s,type,minutes:MDAY,label:'',createdAt:now}));n=dates.length}
  else dates.forEach(s=>{const used=entriesOn(s).reduce((x,e)=>x+e.minutes,0);if(used+m>MDAY){skip++;return}
    const ex=S.entries.find(e=>e.date===s&&e.type===type);if(ex)ex.minutes+=m;else S.entries.push({id:uid(),date:s,type,minutes:m,label:'',createdAt:now});n++});
  return{n,skip};
}
function readAmt(){const c=$('#amtCustom').value;let m=draft.amt;if(c){m=parseHM(c);if(m==null||m<=0||m>MDAY){toast(t('hoursFmt'));return null}}return m}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('button,[data-act]');if(!el)return;
  if(el.dataset.tab){if(el.dataset.tab!=='month')setRangeSilently();show(el.dataset.tab);return}
  if(el.dataset.themeSet){setTheme(el.dataset.themeSet);return}
  if(el.dataset.langSet){lang=el.dataset.langSet;localStorage.setItem('verlof-lang',lang);applyI18n();applyTheme();render();return}
  if(el.dataset.day){onDay(el.dataset.day);return}
  if(el.dataset.trip){openTrip(el.dataset.trip);return}
  if(el.dataset.tyear){tYear=+el.dataset.tyear;renderTrips();return}
  if(el.dataset.delflight){td.flights.splice(+el.dataset.delflight,1);drawTrip();return}
  if(el.dataset.delcost){td.costs.splice(+el.dataset.delcost,1);drawTrip();return}
  if(el.dataset.week){const d=parse(el.dataset.week);const th=addDays(d,3);mCur=new Date(th.getFullYear(),th.getMonth(),1);show('month');return}
  if(el.dataset.type){draft.type=el.dataset.type;document.querySelectorAll('#tchips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.type===draft.type));return}
  if(el.dataset.amt){draft.amt=+el.dataset.amt;$('#amtCustom').value='';document.querySelectorAll('#achips .chip').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.amt===draft.amt));return}
  if(el.dataset.del){S.entries=S.entries.filter(e=>e.id!==el.dataset.del);save();const s=draft.date;render();openDay(s);toast(t('removed'));return}
  const act=el.dataset.act;if(!act)return;
  switch(act){
    case 'import':$('#file').click();break;
    case 'start-empty':S=blank();save();show('home');break;
    case 'settings':closeSheet();show(tab==='settings'?lastTab:'settings');break;
    case 'theme':setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');break;
    case 'add':if(!S)return;setRangeSilently();openAdd();break;
    case 'bcs':openBCS();break;
    case 'close':closeSheet();break;
    case 'mprev':stepMonth(-1);break;
    case 'mnext':stepMonth(1);break;
    case 'mtoday':{const n=new Date();mCur=new Date(n.getFullYear(),n.getMonth(),1);renderMonth();break}
    case 'range':setRange(!rangeMode);break;
    case 'yprev':stepYear(-1);break;
    case 'ynext':stepYear(1);break;
    case 'export':exportData();break;
    case 'addtrip':openTrip(null);break;
    case 'addflight':{const last=td.flights[td.flights.length-1];td.flights.push({date:last?td.end:td.start,time:'',route:'',airline:'',cost:null});drawTrip();break}
    case 'addcost':td.costs.push({label:'',amount:null});drawTrip();break;
    case 'deltrip':if(confirm(t('confirmDelTrip',td.name))){S.trips=S.trips.filter(x=>x.id!==td.id);save();closeSheet();render();toast(t('tripDeleted'))}break;
    case 'savetrip':{
      if(!td.start||!td.end){toast(t('fillDates'));return}
      if([...td.flights.map(f=>f.cost),...td.costs.map(c=>c.amount)].some(v=>v!=null&&isNaN(v))){toast(t('priceFmt'));return}
      if(td.end<td.start)[td.start,td.end]=[td.end,td.start];
      td.name=td.name.trim()||t('trip');const isNew=td.isNew;delete td.isNew;
      td.flights.sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1);
      S.trips=S.trips.filter(x=>x.id!==td.id);S.trips.push(td);tYear=+td.start.slice(0,4);
      save();closeSheet();render();toast(isNew?t('tripAdded'):t('tripSaved'));break}
    case 'reset':if(confirm(t('confirmReset'))){localStorage.removeItem(KEY);S=null;show('welcome')}break;
    case 'saveday':{
      if(!draft.type){toast(t('pickType'));return}
      const m=readAmt();if(m==null)return;
      const used=entriesOn(draft.date).reduce((x,e)=>x+e.minutes,0);
      if(used+m>MDAY){toast(t('onlyLeft',hm(MDAY-used)));return}
      saveEntries([draft.date],draft.type,used?m:m);
      const ty=draft.type;save();closeSheet();render();toast(t('saved',TYPES[ty].name,hm(m)));break}
    case 'saveadd':{
      const ds=workdaysIn(draft.from,draft.to);if(!ds.length){toast(t('noWorkdays'));return}
      const m=readAmt();if(m==null)return;
      const ty=draft.type;const r=saveEntries(ds,ty,m);
      const y=+ds[0].slice(0,4),mo=+ds[0].slice(5,7)-1;mCur=new Date(y,mo,1);
      save();closeSheet();render();toast(t('savedDays',r.n,TYPES[ty].name)+(r.skip?' · '+t('skippedFull',r.skip):''));break}
    case 'saverange':{const r=saveEntries(draft.dates,draft.type,MDAY);const ty=draft.type;
      save();closeSheet();render();toast(t('savedDays',r.n,TYPES[ty].name));break}
    case 'clearrange':{const set=new Set(draft.dates);const n=S.entries.length;S.entries=S.entries.filter(e=>!set.has(e.date));save();closeSheet();render();toast(n===S.entries.length?t('nothingClear'):t('cleared'));break}
    case 'savebcs':{const m={};for(const k of TKEYS){const v=parseHM($('#bcs-'+k).value||'0');if(v==null){toast(t('bcsFmt'));return}m[k]=v}
      S.bcsChecks.push({date:todayStr(),savedAt:new Date().toISOString(),minutes:m,bookedAtCheck:totals(S.entries),note:''});
      save();closeSheet();render();toast(t('checkSaved'));break}
  }
});
function setRangeSilently(){rangeMode=false;rangeStart=null;$('#rangeBtn').setAttribute('aria-pressed','false');$('#rangehint').hidden=true}
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.dataset.allow){const[y,k]=el.dataset.allow.split(':');const v=Math.max(0,+el.value||0);
    S.years[y]=S.years[y]||{};S.years[y].allowanceMinutes={...(S.years[y].allowanceMinutes||{}),[k]:v*60};save();toast(t('setTo',y,TYPES[k].name,v));return}
  if(el.dataset.carry){const k=el.dataset.carry;const v=el.value.trim()===''?null:Math.max(0,+el.value||0);
    S.settings.carryLimitMinutes={...(S.settings.carryLimitMinutes||{}),[k]:v==null?null:v*60};save();toast(t('limitSet',TYPES[k].name,v))}
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

applyI18n();applyTheme();
show(S?'home':'welcome');
if(!S&&/[?&]demo\b/.test(location.search)){
  fetch('../uploads/leave-history.json').then(r=>r.json()).then(d=>{DEMO=true;$('#demo').hidden=false;S=normalize(d);show('home')}).catch(()=>{});
}
if('serviceWorker' in navigator&&location.protocol==='https:'&&!DEMO)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
